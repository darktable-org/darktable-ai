[project]
name = "darktable-ai"
version = "0.1.0"
description = "AI model conversion and packaging pipeline for darktable"
requires-python = ">=3.11,<3.13"
license = "GPL-3.0"
readme = "README.md"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
]

[project.scripts]
dtai = "darktable_ai.cli:main"

[dependency-groups]
core = [
    "torch>=2.2.0,<2.7",
    "torchvision>=0.17.0,<0.22",
    "numpy<2.0",
    "onnx>=1.10.0",
    "onnxruntime",
    "onnxsim",
    # headless, not opencv-python: albumentations/albucore pull
    # opencv-python-headless, and both variants install into the same
    # cv2/ namespace. Two of them race over cv2/__init__.py and CI ends
    # up with a half-written package (cv2.imread missing). We use no GUI
    # calls, so headless is the single consistent variant.
    "opencv-python-headless",
]
nafnet = [
    {include-group = "core"},
    "onnxconverter-common",
    "addict",
    "lmdb",
    "scikit-image",
    "scipy",
    "tqdm",
    "yapf",
    "requests",
    "future",
    "tb-nightly",
]
nind = [
    {include-group = "core"},
    "onnxconverter-common",
]
rawnind = [
    {include-group = "core"},
    "onnxconverter-common",
    "rawpy",
    "tifffile",
    "configargparse",
    "pytorch-msssim",
    "colour-science",
    "ptflops",
]
segnext = [
    {include-group = "core"},
    "mmcv>=2.2.0",
    "albumentations",
    "easydict",
    "setuptools",
]
bsrgan = [
    {include-group = "core"},
]
sam21 = [
    {include-group = "core"},
    "torch>=2.5.1",
    "hydra-core>=1.3.2",
    "iopath>=0.1.10",
]
all-models = [
    {include-group = "nafnet"},
    {include-group = "nind"},
    {include-group = "rawnind"},
    {include-group = "segnext"},
    {include-group = "bsrgan"},
    {include-group = "sam21"},
]
eval = [
    "numpy<2.0",
    "onnxruntime",
    "Pillow",
    "scipy",
]

[tool.uv]
# mmcv/mmengine require opencv-python while albumentations/albucore
# require opencv-python-headless; both install into the same cv2/
# namespace and race over cv2/__init__.py, leaving a half-written
# package on CI (cv2.imread missing). Force the headless variant
# everywhere — mmcv imports cv2 too and we use no GUI calls — so the
# shared venv only ever has one opencv.
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[tool.uv.extra-build-dependencies]
mmcv = ["setuptools<71"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["darktable_ai"]
